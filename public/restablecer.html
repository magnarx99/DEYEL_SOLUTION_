<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nueva contraseña | PQRDS Gobernación de Antioquia</title>
  <link rel="icon" href="/img/logo-placeholder.svg">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/componentes.css">
  <link rel="stylesheet" href="/css/tema.css">
  <script type="module" src="/js/clave.js"></script>
</head>
<body data-pagina="restablecer" data-migas='[["Inicio","/"],["Iniciar sesión","/login.html"],["Nueva contraseña"]]'>
  <main id="contenido">
    <div class="contenedor">
      <div class="caja-auth">
        <form class="panel formulario" id="form-clave" novalidate>
          <h1 style="font-size:1.75rem">Cree una contraseña nueva</h1>
          <div class="campo" style="margin-top:16px">
            <label for="f-password">Contraseña nueva</label>
            <div class="con-boton"><input id="f-password" name="password" type="password" autocomplete="new-password" required maxlength="72"><button type="button" data-ver-password aria-label="Mostrar contraseña"><svg class="icono" aria-hidden="true"><use href="/img/iconos.svg#i-eye"></use></svg></button></div>
            <div class="fortaleza" aria-hidden="true" style="margin-top:6px"><span id="barra-fortaleza"></span></div>
            <span class="fortaleza-texto" id="texto-fortaleza" aria-live="polite"></span>
            <span class="ayuda">Mínimo 8 caracteres, con una mayúscula, un número y un símbolo.</span>
            <span class="error-campo"></span>
          </div>
          <div class="campo" style="margin-top:16px">
            <label for="f-confirmar_password">Confirmar contraseña</label>
            <div class="con-boton"><input id="f-confirmar_password" name="confirmar_password" type="password" autocomplete="new-password" required maxlength="72"><button type="button" data-ver-password aria-label="Mostrar contraseña"><svg class="icono" aria-hidden="true"><use href="/img/iconos.svg#i-eye"></use></svg></button></div>
            
            <span class="error-campo"></span>
          </div>
          <div id="mensaje" style="margin-top:16px"></div>
          <button class="boton boton-ancho" type="submit" id="enviar" data-cargando="Guardando…" style="margin-top:20px">Guardar contraseña</button>
        </form>
      </div>
    </div>
  </main>
</body>
</html>
