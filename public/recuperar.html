<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recuperar contraseña | PQRDS Gobernación de Antioquia</title>
  <link rel="icon" href="/img/logo-placeholder.svg">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/componentes.css">
  <link rel="stylesheet" href="/css/tema.css">
  <script type="module" src="/js/clave.js"></script>
</head>
<body data-pagina="recuperar" data-migas='[["Inicio","/"],["Iniciar sesión","/login.html"],["Recuperar contraseña"]]'>
  <main id="contenido">
    <div class="contenedor">
      <div class="caja-auth">
        <form class="panel formulario" id="form-clave" novalidate>
          <h1 style="font-size:1.75rem">Recuperar contraseña</h1>
          <p class="texto-suave">Escriba el correo con el que creó su cuenta. Le enviaremos un enlace para crear una contraseña nueva, válido por 30 minutos.</p>
          <div class="campo">
            <label for="f-correo">Correo electrónico</label>
            <input id="f-correo" name="correo" type="email" autocomplete="email" required>
            <span class="error-campo"></span>
          </div>
          <div id="mensaje" style="margin-top:16px"></div>
          <button class="boton boton-ancho" type="submit" id="enviar" data-cargando="Enviando…" style="margin-top:20px">Enviar enlace</button>
          <p style="margin:20px 0 0" class="texto-chico"><a href="/login.html">Volver a iniciar sesión</a></p>
        </form>
      </div>
    </div>
  </main>
</body>
</html>
