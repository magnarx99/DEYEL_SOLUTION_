        <path d="M0 22 L10 0 L20 22 Z" fill="#D49A7E"/><path d="M48 22 L58 0 L68 22 Z" fill="#D49A7E"/>
        <rect x="9" y="-8" width="2" height="9" fill="#1E3A5F"/><rect x="6" y="-5" width="8" height="2" fill="#1E3A5F"/>
        <rect x="57" y="-8" width="2" height="9" fill="#1E3A5F"/><rect x="54" y="-5" width="8" height="2" fill="#1E3A5F"/>
        <rect x="7" y="30" width="6" height="10" rx="3" fill="#A8C5E2"/><rect x="55" y="30" width="6" height="10" rx="3" fill="#A8C5E2"/>
        <rect x="16" y="44" width="36" height="56" fill="#FFFFFF"/>
        <path d="M12 46 L34 28 L56 46 Z" fill="#D49A7E"/>
        <circle cx="34" cy="58" r="7" fill="#A8C5E2"/><circle cx="34" cy="58" r="3" fill="#FFFFFF"/>
