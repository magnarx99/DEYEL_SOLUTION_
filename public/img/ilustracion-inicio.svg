      <rect x="0" y="22" width="100" height="4" fill="#D9675A"/><rect x="0" y="28" width="100" height="3" fill="#3D7CB8"/><rect x="0" y="33" width="100" height="3" fill="#3C8C6E"/>
      <circle cx="22" cy="42" r="8" fill="#1E3A5F"/><circle cx="22" cy="42" r="3" fill="#A8C5E2"/>
