<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" role="img" aria-labelledby="t-ini">
  <title id="t-ini">Pueblo antioqueño entre montañas cafeteras, con una chiva, la iglesia y un celular radicando una solicitud en el portal</title>
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#CFE3F6"/><stop offset=".7" stop-color="#EEF5FC"/><stop offset="1" stop-color="#F7FAFD"/></linearGradient>
    <radialGradient id="sol" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FCE7BF"/><stop offset=".55" stop-color="#F9DCA8" stop-opacity=".6"/><stop offset="1" stop-color="#F9DCA8" stop-opacity="0"/></radialGradient>
    <linearGradient id="m1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B9D0E8"/><stop offset="1" stop-color="#D3E3F2"/></linearGradient>
    <linearGradient id="m2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#93B8DA"/><stop offset="1" stop-color="#B4CDE6"/></linearGradient>
    <linearGradient id="m3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7FB9AE"/><stop offset="1" stop-color="#A3CFC2"/></linearGradient>
    <linearGradient id="m4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9DCBB2"/><stop offset="1" stop-color="#C2E0CC"/></linearGradient>
    <linearGradient id="pantalla" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F1F6FB"/></linearGradient>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1E3A5F" flood-opacity=".16"/></filter>
    <filter id="sombra-suave" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1E3A5F" flood-opacity=".14"/></filter>
    <clipPath id="marco"><rect x="20" y="10" width="520" height="400" rx="36"/></clipPath>
  </defs>

  <!-- ================= Paisaje ================= -->
