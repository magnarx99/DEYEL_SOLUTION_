  <circle cx="276" cy="77" r="13" fill="#E6F3F2"/>
  <g transform="translate(266 67)"><circle cx="10" cy="10" r="9" fill="#4FA3A5"/><circle cx="7" cy="9" r="1.5" fill="#FFFFFF"/><circle cx="13" cy="9" r="1.5" fill="#FFFFFF"/><path d="M6.5 12.5 q3.5 3 7 0" stroke="#FFFFFF" stroke-width="1.5" fill="none" stroke-linecap="round"/></g>
  <text x="296" y="73" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#2B5C8A">¿Le ayudo con</text>
  <text x="296" y="89" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#2B5C8A">su solicitud?</text>

