  <rect x="50" y="189" width="24" height="7" rx="3" fill="#336EA3"/>
  <path d="M56 204 l3 3 l7 -7" fill="none" stroke="#336EA3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="82" y="199" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#5A6B7E">Respuesta en</text>
  <text x="82" y="213" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1E3A5F">días hábiles</text>
