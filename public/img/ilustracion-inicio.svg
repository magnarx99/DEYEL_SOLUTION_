    <circle cx="412" cy="133" r="6" fill="#DCEAF7"/>
    <rect x="422" y="129" width="46" height="4" rx="2" fill="#FFFFFF" opacity=".9"/><rect x="422" y="136" width="30" height="3" rx="1.5" fill="#A8C5E2"/>
    <text x="407" y="164" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1E3A5F">Radicar PQRDS</text>
    <rect x="407" y="170" width="70" height="3" rx="1.5" fill="#D6E3F0"/>
    <text x="407" y="188" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="7.5" fill="#5A6B7E">Número de cédula</text>
    <rect x="407" y="192" width="94" height="20" rx="6" fill="#FFFFFF" stroke="#336EA3" stroke-width="1.5"/>
    <text x="413" y="206" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" font-weight="600" fill="#2A3645" letter-spacing=".6">1017••••67</text>
    <rect x="407" y="218" width="94" height="40" rx="7" fill="#E6F3F2"/>
    <rect x="407" y="218" width="3" height="40" fill="#4FA3A5"/>
    <circle cx="420" cy="231" r="6" fill="#4FA3A5"/><path d="M417 231 l2 2 l4 -4" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="430" y="234" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="8" font-weight="700" fill="#1E3A5F">¡Lo reconocimos!</text>
