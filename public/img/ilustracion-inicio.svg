      <g><circle cx="380" cy="392" r="4" fill="#F2C76E"/><circle cx="388" cy="388" r="4" fill="#D9675A"/><circle cx="396" cy="393" r="4" fill="#F4A6B8"/><circle cx="386" cy="397" r="3" fill="#FFFFFF"/></g>
