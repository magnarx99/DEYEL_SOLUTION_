      </g>
      <g transform="translate(46 6)">
        <rect x="0" y="34" width="40" height="40" fill="#FFF8EE"/><path d="M-4 36 L20 22 L44 36 Z" fill="#D49A7E"/>
        <rect x="5" y="42" width="11" height="11" fill="#3D7CB8"/><rect x="24" y="42" width="11" height="11" fill="#3D7CB8"/>
        <rect x="3" y="53" width="15" height="3" fill="#F2C76E"/><rect x="22" y="53" width="15" height="3" fill="#F2C76E"/>
        <rect x="15" y="60" width="10" height="14" fill="#4FA3A5"/>
