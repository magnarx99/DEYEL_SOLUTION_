    <path d="M20 292 C70 254 130 246 196 258 C260 270 318 248 384 250 C450 252 500 262 540 254 L540 410 L20 410 Z" fill="url(#m3)"/>
    <g fill="none" stroke="#5F9F92" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 7" opacity=".7">
