    <rect x="407" y="312" width="94" height="22" rx="7" fill="#2B5C8A"/>
    <text x="454" y="327" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#FFFFFF">Continuar</text>
    <rect x="436" y="342" width="36" height="3" rx="1.5" fill="#A8C5E2"/>
