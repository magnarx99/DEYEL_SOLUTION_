  <path d="M512 99 l11 4 v8 c0 8 -5 12 -11 15 c-6 -3 -11 -7 -11 -15 v-8 Z" fill="#3C8C6E"/>
  <path d="M507 111 l4 4 l7 -8" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ================= Burbuja del asistente ================= -->
  <g filter="url(#sombra)">
    <path d="M262 48 h112 a14 14 0 0 1 14 14 v30 a14 14 0 0 1 -14 14 h-10 l4 16 l-20 -16 h-86 a14 14 0 0 1 -14 -14 v-30 a14 14 0 0 1 14 -14 z" fill="#FFFFFF"/>
