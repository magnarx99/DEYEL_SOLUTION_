      <path d="M415 286 h12 M415 290 h12 M415 294 h8" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M448 284 h12 v10 h-7 l-3 3 v-3 h-2 Z" fill="none" stroke="#336EA3" stroke-width="1.4" stroke-linejoin="round"/>
