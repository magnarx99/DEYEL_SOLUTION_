    <circle cx="122" cy="84" r="78" fill="url(#sol)"/>
    <circle cx="122" cy="84" r="28" fill="#FBE4BA"/>
    <g fill="#FFFFFF">
      <path d="M190 74c0-12 10-21 22-21 9 0 16 5 19 12 3-2 6-3 9-3 9 0 16 7 16 16h-66z" opacity=".95"/>
      <path d="M48 140c0-9 7-16 16-16 6 0 12 4 14 9 2-1 4-2 7-2 7 0 12 5 12 12H48z" opacity=".8"/>
      <path d="M300 42c0-7 6-13 13-13 5 0 9 3 11 7 2-1 3-1 5-1 6 0 10 4 10 10h-39z" opacity=".75"/>
    </g>
    <g fill="none" stroke="#5A6B7E" stroke-width="1.8" stroke-linecap="round" opacity=".55">
      <path d="M166 120 q5 -5 10 0 q5 -5 10 0"/><path d="M190 106 q4 -4 8 0 q4 -4 8 0"/><path d="M150 104 q3 -3 6 0 q3 -3 6 0"/>
    </g>

    <!-- Cordilleras -->
    <path d="M20 214 L84 150 L132 186 L196 118 L262 176 L318 132 L380 184 L440 140 L500 178 L540 158 L540 410 L20 410 Z" fill="url(#m1)"/>
    <path d="M196 118 L214 136 L204 134 L196 142 L188 134 L180 134 Z" fill="#FFFFFF" opacity=".55"/>
    <path d="M20 248 L70 212 L126 236 L192 188 L262 232 L330 200 L398 238 L456 208 L540 236 L540 410 L20 410 Z" fill="url(#m2)"/>

