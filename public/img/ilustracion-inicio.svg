  <path d="M60 336 l5 5 l11 -12" fill="none" stroke="#3C8C6E" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="94" y="331" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5A6B7E">Solicitud radicada</text>
  <text x="94" y="349" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1E3A5F">PQRDS-2026-000041</text>
  <path d="M62 374 H154" stroke="#4FA3A5" stroke-width="3" stroke-linecap="round"/>
  <path d="M154 374 H246" stroke="#DCE6F1" stroke-width="3" stroke-linecap="round"/>
  <circle cx="62" cy="374" r="6" fill="#4FA3A5"/><circle cx="154" cy="374" r="6" fill="#4FA3A5"/>
  <circle cx="246" cy="374" r="6" fill="#FFFFFF" stroke="#A8C5E2" stroke-width="2"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6B7E">
